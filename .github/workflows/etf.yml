name: etf-flows
# Farside posts partial US spot BTC ETF flows ~6:30-8:30 PM ET and IBIT (final) ~midnight ET,
# occasionally as late as ~4 AM ET. Run every 15 min from US market open through next morning ET
# on weekdays, plus a 3-hourly catch-all. Times below are UTC.
on:
  schedule:
    - cron: '*/15 13-23 * * 1-5'
    - cron: '*/15 0-10 * * 2-6'
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etf
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot previous data
        run: cp etf.json /tmp/prev.json 2>/dev/null || echo '{}' > /tmp/prev.json
      - name: Fetch Farside
        run: python3 etf_flows.py
      - name: Commit if data changed
        run: |
          changed=$(python3 - <<'PY'
          import json
          a=json.load(open('/tmp/prev.json')); b=json.load(open('etf.json'))
          a.pop('updated',None); b.pop('updated',None)
          print('yes' if a!=b else 'no')
          PY
          )
          echo "changed=$changed"
          if [ "$changed" = yes ]; then
            git config user.name "kris-etf-bot"
            git config user.email "krisx-scanner@users.noreply.github.com"
            git add etf.json
            git commit -m "etf.json $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
