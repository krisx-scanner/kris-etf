name: etf-flows
# Farside posts partial US spot BTC ETF flows ~23:30-01:30 UTC and the final day (IBIT) ~04:45-05:05 UTC
# Tue-Sat, occasionally later (06:50, 08:40 UTC seen). Dense runs 04:40-06:00 UTC so the complete day is
# live by 05:30 UTC even with GitHub's 5-20 min cron delays. All times UTC.
on:
  schedule:
    - cron: '*/15 13-23 * * 1-5'      # US market hours + evening partials (Mon-Fri)
    - cron: '*/15 0-3 * * 2-6'        # overnight partials (Tue-Sat)
    - cron: '40,50 4 * * 2-6'         # dense final-post window starts
    - cron: '*/10 5 * * 2-6'          # 05:00-05:50 every 10 min
    - cron: '15 5 * * 2-6'            # guaranteed 05:15 run
    - cron: '0 6 * * 2-6'
    - cron: '30 6 * * 2-6'
    - cron: '0 7,8,9,10 * * 2-6'      # catch-up for late days
    - cron: '7 */3 * * *'             # 3-hourly safety net, every day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etf
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot previous data
        run: cp etf.json /tmp/prev.json 2>/dev/null || echo '{}' > /tmp/prev.json
      - name: Fetch Farside
        run: python3 etf_flows.py
      - name: Commit if data changed
        run: |
          changed=$(python3 - <<'PY'
          import json
          a=json.load(open('/tmp/prev.json')); b=json.load(open('etf.json'))
          a.pop('updated',None); b.pop('updated',None)
          print('yes' if a!=b else 'no')
          PY
          )
          echo "changed=$changed"
          if [ "$changed" = yes ]; then
            git config user.name "kris-etf-bot"
            git config user.email "krisx-scanner@users.noreply.github.com"
            git add etf.json
            git commit -m "etf.json $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
